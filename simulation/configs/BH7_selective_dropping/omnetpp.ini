# ============================================================================
# OMNeT++ 6.1 / INET 4.5 / modified AODV
# Covers the Section 4.4 normal control and Drop100 / Drop50 / Drop25 variants.
# ============================================================================

[General]
network = AODVNetwork
**.mobility.rng-0 = 1
**.wlan[*].mac.rng-0 = 2

# Scalar-count collection; no event log or vector records.
record-eventlog = false
**.statistic-recording = true
**.scalar-recording = true
**.vector-recording = false
**.result-recording-modes = count

# Communication range is defined once as 250m in DatasetBase.
# Interference and detection ranges are separate parameters (150m each).
**.wlan[*].radio.transmitter.interferenceRange = 150m
**.wlan[*].radio.transmitter.detectionRange = 150m
**.wlan[*].radio.receiver.ignoreInterference = false
**.wlan[*].typename = "AckingWirelessInterface"
**.wlan[*].bitrate = 2Mbps
**.wlan[*].mac.headerLength = 23B
**.wlan[*].radio.typename = "UnitDiskRadio"
**.wlan[*].radio.transmitter.headerLength = 96b
*.visualizer.mediumVisualizer.displayCommunicationRanges = true

# 800m x 800m mobility area.
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 800m
**.mobility.constraintAreaMaxY = 800m

# Lifecycle and behavioral counters (including leakage-audit signals).
**.hasStatus = true
**.host[*].aodv.rreqDrop.record = true
**.host[*].aodv.dataDrop.record = true
**.host[*].aodv.rrepSpoofed.record = true
**.host[*].aodv.numPacketsForwarded.record = true
**.host[*].aodv.numRREQsReceived.record = true
**.host[*].aodv.numRREQsSent.record = true
**.host[*].aodv.numRREPsSent.record = true
**.cmdenv-log-level = detail

[Config DatasetBase]
description = "Base settings for 7-node MANET behavioral evaluation"
sim-time-limit = 600s
*.numHosts = 7

# 300 paired repetition indices: 0..299 (same seed set per condition).
repeat = 300
seed-set = ${repetition}

# RNG streams: mobility=1, MAC=2, AODV selective dropping=3.
num-rngs = 4
**.aodv.rng-1 = 3

# Radio and physical-layer settings.
*.host[*].wlan[*].radio.transmitter.communicationRange = 250m
*.host[*].wlan[0].radio.transmitter.bitrate = 2Mbps
*.host[*].wlan[0].radio.phyOpMode = "g"
*.host[*].wlan[0].radio.transmitter.power = 2mW

# Continuous Random Waypoint mobility.
**.host[*].mobility.typename = "RandomWaypointMobility"
**.host[*].mobility.speed = uniform(1mps, 15mps)
**.host[*].mobility.waitTime = 0s

# PingApp traffic; host[0] sends to a run-random destination host[1..6].
**.host[*].numApps = 1
**.host[*].app[0].typename = "PingApp"
**.host[0].app[0].destAddr = "host[" + string(intuniform(1, 6, 1)) + "]"
**.host[0].app[0].startTime = 1s
**.host[0].app[0].sendInterval = 0.5s
**.host[*].app[0].printPing = false

# Modified AODV.
**.host[*].ipv4.routingProtocol.typename = "Aodv"
**.aodv.activeRouteTimeout = 3s

[Config DatasetNormal]
extends = DatasetBase
description = "300 runs: 7 benign nodes"

[Config DatasetAttacker]
extends = DatasetBase
description = "300 runs: 6 benign nodes and Blackhole host[5]"
**.host[5].aodv.isblackhole = true

# Three independent attacked variants inherit DatasetAttacker and DatasetBase.
[Config BH7_Drop100]
extends = DatasetAttacker
description = "300 runs: 100% packet dropping"
**.host[5].aodv.blackholeDropProbability = 1.0

[Config BH7_Drop50]
extends = DatasetAttacker
description = "300 runs: 50% probabilistic packet dropping"
**.host[5].aodv.blackholeDropProbability = 0.5

[Config BH7_Drop25]
extends = DatasetAttacker
description = "300 runs: 25% probabilistic packet dropping"
**.host[5].aodv.blackholeDropProbability = 0.25
